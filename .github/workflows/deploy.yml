name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-public files
        # Pages の deploy は .assetsignore を見ないので、配信しないファイルはここで消す
        run: rm -rf ./*.md .claude .github .gitignore .assetsignore wrangler.jsonc .wrangler build.py build_en.py scripts_build_odai.py
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.85.0"
          command: pages deploy . --project-name=ninja-haa --branch=main --commit-dirty=true
