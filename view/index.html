<style>
/* OBS のブラウザソース向け（1920x1080 を想定・vw/vh で拡大縮小）。

:root{--orange:#ff8a3d;--orange-d:#e07b39;--ink:#3b2c22;--muted:#8a7560;--paper:#fffdf9;--line:#f0e2cc;--navy:#16213a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}

.cd span{font-size:40vh;font-weight:900;color:var(--orange);text-shadow:0 0 2vh #fff,0 0 4vh #fff;animation:pop .7s ease both}

/* ===== 2026-10-20 大事な情報を大きく・太く（挿し絵は外す）。D4 の巻物・朱の札・判子で場面が一目で分かるように ===== */
:root{--sumi:#1f1a17;--shu:#d9432a;--kinari:#fbf3e4}
.stage .pic,.winpic{display:none!important}
.stage.scroll{background:none;color:var(--sumi);box-shadow:none;border-radius:0;border-style:solid;border-width:3.2vh 7vh;border-image:url(/kit/img/d3-scroll.webp) 56 84 fill / 3.2vh 7vh stretch;padding:1vh 2vw 1.6vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:3vw;filter:drop-shadow(.6vh .6vh 0 rgba(31,26,23,.35))}

.panel{background:var(--kinari);border:.4vh solid var(--sumi);border-radius:1vh;box-shadow:.7vh .7vh 0 var(--sumi)}

.answers.many .ans-main .n{font-size:6vh}.answers.many .ans-main .a{font-size:4.4vh}.answers.many .ans-top{font-size:3vh}.answers.many .ans-main{padding:1.4vh 9vh 1.4vh 1.4vw}.answers.many .kick{width:8vh;height:8vh;margin-top:-4vh;font-size:2.8vh}.answers.many .chip{font-size:2.6vh}.answers.many .chip.ok{font-size:3vh}

.rcw .p{display:inline-flex;align-items:center;gap:.6vw}
.rcw .p small{font-size:2.6vh;color:#4a3f37;font-family:system-ui,sans-serif}
.rcw .hk,.stamp .hk{display:inline-grid;place-items:center;background:url(/kit/img/d4-hanko.webp) center/100% 100% no-repeat;color:var(--shu);font-family:"Yuji Syuku",serif;font-weight:400;transform:rotate(-12deg)}
.rcw .hk{width:6vh;height:6vh;font-size:2.8vh}
.rcw .n{margin-left:auto;color:var(--shu)}
.chip small.mk{font-size:.7em;margin-left:.4vw;opacity:.85;font-family:system-ui,sans-serif}
.stamp{position:fixed;left:50%;top:16vh;z-index:20;transform:translateX(-50%);display:flex;align-items:center;gap:2vw;padding:2vh 4vw 2vh 2vw;background:var(--kinari) url(/kit/img/d4-washi.webp) 0 0/320px auto;border:.6vh solid var(--sumi);border-radius:1vh;box-shadow:1vh 1vh 0 var(--sumi);color:var(--sumi);white-space:nowrap;max-width:94vw;pointer-events:none}
.stamp[hidden]{display:none}
.stamp .hk{width:14vh;height:14vh;font-size:7vh}
.stamp .t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.stamp .t b{font-size:6.4vh;font-weight:900;overflow:hidden;text-overflow:ellipsis}
.stamp .t small{font-size:4vh;font-weight:800;color:#4a3f37}
.stamp .no{font-size:5vh;font-weight:900;color:#fff;background:var(--shu);border:.45vh solid var(--sumi);border-radius:.8vh;padding:0 .5em}
.stamp.go{animation:sIn .2s ease-out both,sOut .2s .8s ease-in both}
.stamp.go .hk{animation:stampIn .35s .12s cubic-bezier(.3,1.6,.5,1) both}
@keyframes sIn{from{opacity:0;transform:translateX(-50%) translateY(-20%)}to{opacity:1;transform:translateX(-50%)}}
@keyframes sOut{to{opacity:0}}
body.vert .stamp .t b{font-size:5.4vw}body.vert .stamp .t small{font-size:3.6vw}body.vert .stamp .no{font-size:4vw}body.vert .stamp .hk{width:11vw;height:11vw;font-size:5.4vw}body.vert .rcw{font-size:4.4vw}body.vert .rcw .h,body.vert .rcw .p small{font-size:3vw}body.vert .rcw .hk{width:6vw;height:6vw;font-size:3vw}
@media (prefers-reduced-motion:reduce){.stamp.go,.stamp.go .hk{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="cd" id="cd"></div>
<div class="stamp" id="stamp" hidden></div>
<div class="recent" id="recent" aria-label="直近の回"></div>
<div class="credit">声と表情で当てるゲーム｜haa.kkpwebninja.com</div>
<div class="howto" id="howto">操作は同じパソコンの「声と表情で当てるゲーム」のページで。このウィンドウをOBSの「ウィンドウキャプチャ」で取り込んでください（「ブラウザソース」では操作がつながりません）</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get('bg') === 'cream') document.body.classList.add('bg-cream');
  if (q.get('layout') === 'v') document.body.classList.add('vert');
  var wrap = document.getElementById('wrap'), cd = document.getElementById('cd'), recentEl = document.getElementById('recent');
  function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function cands(st, label){
    if (!st.cands || !st.cands.length) return '';
    return '<div class="panel"><div class="cl">'+esc(label||'気持ちの候補')+'</div><div class="cands">'
      + st.cands.map(function(c){ return '<div><span class="no">'+esc(c.no)+'</span>'+esc(c.text).replace(/「[^」]*」/, function(m){ return '<span class="q">'+m+'</span>'; })+'</div>'; }).join('') + '</div></div>';
  }
  function stage(st, who){
    return '<div class="stage scroll"><div class="who">'+esc(who)+'</div><div class="word">「'+esc(st.word)+'」</div>'
      + '<div class="chat">リスナーのみなさん、コメントで番号を当ててください（例：③）</div></div>';
  }
  // 配る場面（2026-10-20）：「いま◯◯さんが確認中」「全員の確認が済んだら始まります」と確認済みの判子。届くのは名前と印だけ（だれがどの気持ちかは届かない）
  var stamped = {};
  function dealStage(st){
    var p = st.dealPpl, cur = null, done = 0, all = true;
    p.forEach(function(x){ if (x.s === 1) cur = x; if (x.s === 2) done++; else all = false; });
    var fuda = all ? (p.length > 1 ? '全員の確認が済みました' : '確認が済みました') : cur ? 'いま '+cur.n+' さんが確認中' : '気持ちの確認';
    var sub = all ? 'まもなく始まります' : (cur ? '' : '演じる人が自分の気持ちを、こっそり見ます。') + (p.length > 1 ? '全員の' : '') + '確認が済んだら始まります（'+done+' / '+p.length+'）';
    var key0 = (st.word||'') + '|';
    return '<div class="stage scroll deal"><div class="who">'+esc(fuda)+'</div><div class="word">「'+esc(st.word)+'」</div><div class="sub">'+esc(sub)+'</div><div class="ppl">'
      + p.map(function(x, i){
        var k = key0 + i, fresh = x.s === 2 && !stamped[k]; if (x.s === 2) stamped[k] = 1;
        return '<span class="pp s'+esc(x.s)+(fresh?' fresh':'')+'"><span class="pn">'+esc(x.n)+'</span><span class="mk">'+(x.s === 2 ? '済' : x.s === 1 ? '確認中' : 'まだ')+'</span></span>';
      }).join('') + '</div></div>';
  }
  // 回答コードで届いた人（名前と受付の印だけ）
  function rcw(st){
    var L = st.rc || []; if (!L.length) return '';
    return '<div class="panel rcw"><span class="h">回答コード</span>' + L.map(function(x){ return '<span class="p"><span class="hk">済</span>'+esc(x.n)+'<small>'+esc(x.mk)+'</small></span>'; }).join('') + '<span class="n">'+L.length+'人回答済み</span></div>';
  }
  // 受け取った瞬間のハンコ（操作ページで貼ったとき・届いてから4秒以内だけ。読み直しで出し直さない）
  var stampEl = document.getElementById('stamp'), lastStamp = '', stampT = null;
  function showStamp(st){
    var x = st.stamp; if (!x || x.id === lastStamp) return; lastStamp = x.id;
    if (Date.now() - (st.t||0) > 4000) return;
    stampEl.innerHTML = '<span class="hk">済</span><span class="t"><b>'+esc(x.n)+'さん</b><small>受け取りました</small></span><span class="no">受付 '+esc(x.mk)+'</span>';
    stampEl.hidden = false; stampEl.classList.remove('go'); void stampEl.offsetWidth; stampEl.classList.add('go');
    clearTimeout(stampT); stampT = setTimeout(function(){ stampEl.hidden = true; stampEl.classList.remove('go'); }, 1000);
  }
  function render(st){
    if (st) showStamp(st);
    if (!st) { wrap.innerHTML = '<div class="panel idle">声と表情で当てるゲーム<small>操作ページでゲームを始めると、ここに表示されます</small></div>'; return; }
    document.getElementById('howto').hidden = st.step !== 'setup';
    var one = st.actors && st.actors.length === 1 ? st.actors[0] + ' さんの番' : (st.actors ? st.actors.length + '人が順番に演じます' : '');
    var h = '';
    if (st.step === 'setup'){
      h = '<div class="panel idle">声と表情で当てるゲーム<small>まもなく始まります</small></div>';
    } else if (st.step === 'deal' && st.dealPpl && st.dealPpl.length){
      h = dealStage(st) + cands(st) + rcw(st);
    } else if (st.step === 'deal'){
      h = '<div class="stage scroll"><div class="who">'+esc(one)+'</div><div class="word">「'+esc(st.word)+'」</div><div class="sub">演じる人が、自分の気持ちを確認しています</div></div>' + cands(st);
    } else if (st.step === 'perform'){
      h = stage(st, one) + cands(st, '気持ちの候補（この中のどれかを演じます）') + rcw(st);
    } else if (st.step === 'vote'){
      h = stage(st, one) + cands(st) + rcw(st) + '<div class="panel msg">投票中 '+esc(st.voteDone)+' / '+esc(st.voteTotal)+'<small>一緒に遊ぶ人が答えを選んでいます</small></div>';
    } else if (st.step === 'result' && st.veiling){
      h = '<div class="stage scroll"><div class="who">'+esc(one)+'</div><div class="word">「'+esc(st.word)+'」</div><div class="sub">まもなく答え合わせ</div></div>' + cands(st, '気持ちの候補');
    } else if (st.step === 'result'){
      var a = st.answers || [];
      h = '<div class="answers'+(a.length>1?' many':'')+'">' + a.map(function(x){
        var chips = (x.chips||[]).map(function(c){ return '<span class="chip '+(c.ok?'ok':'ng')+'">'+(c.ok?'○ ':'× ')+esc(c.name)+(c.mk?'<small class="mk">'+esc(c.mk)+'</small>':'')+(c.ok?'':' '+esc(c.no))+'</span>'; }).join('');
        return '<div class="ans"><div class="ans-top"><span class="dot" style="background:'+esc(x.color)+'"></span><b>'+esc(x.name)+'</b><span class="w">「'+esc(st.word)+'」</span></div>'
          + '<div class="ans-main"><span class="kick">正解</span><span class="n">'+esc(x.no)+'</span><span class="a">'+esc(x.act)+'</span></div>'
          + (chips ? '<div class="chips">'+chips+'</div>' : '') + '</div>';
      }).join('') + '</div>';
      if (st.ask) h += '<div class="panel msg cta">'+esc(st.ask)+'</div>';
      var s = st.scores;
      if (s && s.rows && s.rows.length){
        var max = Math.max.apply(null, s.rows.map(function(r){return r.total;})) || 0, rank = 0, prev = null;
        h += '<div class="panel scores'+(s.rows.length>=5?' mid many':s.rows.length>=4?' mid':'')+'"><h3>'+(s.rounds>1?'合計得点<small>'+esc(s.rounds)+'回目まで</small>':'得点')+'</h3>' + s.rows.map(function(r,i){
          if (r.total !== prev){ rank = i+1; prev = r.total; }
          return '<div class="sr'+(rank===1&&max>0?' top':'')+'"><span class="rk">'+rank+'位</span><span class="nm">'+esc(r.name)+(r.tries!=null?'<small class="hitx">当てた '+esc(r.hit)+'/'+esc(r.tries)+'・伝わった '+esc(r.got)+'回</small>':'')+'</span>'
            + '<span class="bar"><i style="width:'+(max>0?Math.round(r.total/max*100):0)+'%;background:'+esc(r.color)+'"></i></span><span class="pt">'+esc(r.total)+'点'+(s.rounds>1?'<small>+'+esc(r.add)+'</small>':'')+'</span></div>';
        }).join('') + (s.titles ? '<div class="ttls">'+s.titles.map(function(x){ return '<span><b>'+esc(x.t)+'</b>'+esc(x.names)+'<small>'+esc(x.why)+'</small></span>'; }).join('')+'</div>' : '') + '</div>';
      }
    }
    if (st.summary){
      var sm = st.summary;
      h = '<div class="panel sum"><h2>今日のまとめ</h2>' + (sm.titles ? '<div class="ttls">'+sm.titles.map(function(x){ return '<span><b>'+esc(x.t)+'</b>'+esc(x.names)+'<small>'+esc(x.why)+'</small></span>'; }).join('')+'</div>' : '')
        + '<table><thead><tr><th>名前</th><th>当てた</th><th>伝わった</th><th>点</th></tr></thead><tbody>'
        + (sm.people||[]).map(function(p){ return '<tr><th>'+esc(p.name)+'</th><td>'+esc(p.hit)+'<small>/'+esc(p.tries)+'</small></td><td>'+esc(p.got)+'<small>回</small></td><td class="p">'+esc(p.pts)+'</td></tr>'; }).join('') + '</tbody></table>'
        + ((sm.all||[]).length || (sm.none||[]).length ? '<div class="marks">' + (sm.all||[]).map(function(x){ return '<div class="m-all"><em>伝わった！</em>'+esc(x.no)+'回目「'+esc(x.word)+'」'+esc(x.who)+'</div>'; }).join('') + (sm.none||[]).map(function(x){ return '<div class="m-none"><em>まさかの！</em>'+esc(x.no)+'回目「'+esc(x.word)+'」'+esc(x.who)+'</div>'; }).join('') + '</div>' : '')
        + '</div>';
    }
    var rc = st.recent || [];
    var rkey = rc.length ? rc[rc.length-1].no + '|' + rc.length : '';
    recentEl.innerHTML = rc.length ? rc.map(function(x, i){
      var g = (x.g||[]).length ? x.g.map(function(y){ return '<i class="'+(y.ok?'o':'x')+'">'+(y.ok?'○':'×')+'</i>'; }).join('') : '<i class="x">口で</i>';
      return '<span class="rs'+(x.mark?' m-'+x.mark:'')+(i===rc.length-1 && rkey!==lastRecent?' new':'')+'"><b>'+esc(x.no)+'</b>「'+esc(x.word)+'」'+esc(x.ans)+g+(x.mark==='all'?'<em>伝わった！</em>':x.mark==='none'?'<em>まさかの！</em>':'')+'</span>';
    }).join('') : '';
    lastRecent = rkey;
    var key = st.step + '|' + (st.veiling?1:0) + '|' + (st.word||'');
    if (st.step === 'result' && !st.veiling && lastKey !== key && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) burst();
    lastKey = key;
    wrap.innerHTML = h;
    cd.innerHTML = (st.step === 'result' && st.cd) ? '<span>'+esc(st.cd)+'</span>' : '';
    if (st.step === 'result' && st.veiling && st.last) wrap.innerHTML = '<div class="stage scroll last"><div class="who">最終予想タイム！</div><div class="word">'+esc(st.last)+'</div><div class="chat">コメントで番号を（例：③）</div></div>' + cands(st, '気持ちの候補「'+(st.word||'')+'」');
    fit();
  }
  var lastKey = '', lastRecent = '';
  function fit(){
    // 2026-10-20 出てくる動き（縮んだ所から拡大）の途中で測ると低く見えて縮めそこねる。測る間だけ動きを止める
    wrap.classList.add('measuring');
    var f = 1; wrap.style.setProperty('--f', '1');
    for (var i = 0; i < 24 && wrap.scrollHeight > wrap.clientHeight + 1 && f > 0.4; i++) { f -= 0.04; wrap.style.setProperty('--f', f.toFixed(2)); }
    wrap.classList.remove('measuring');
  }
  window.addEventListener('resize', function(){ clearTimeout(window.__fitT); window.__fitT = setTimeout(fit, 120); });
  function burst(){
    var box = document.createElement('div'); box.className = 'confetti';
    var cols = ['#ff8a3d','#ffd43b','#ff6b9d','#51cf66','#4c6ef5','#fff3e2'];
    for (var i=0;i<110;i++){ var p = document.createElement('i'); p.style.left = (Math.random()*100)+'vw'; p.style.background = cols[i%cols.length];
      p.style.animationDuration = (1.6+Math.random()*1.4)+'s'; p.style.animationDelay = (Math.random()*0.5)+'s'; box.appendChild(p); }
    document.body.appendChild(box); setTimeout(function(){ box.remove(); }, 3800);
  }
  var last = null;
  try { last = JSON.parse(localStorage.getItem('haa-view-state') || 'null'); } catch(e){}
  render(last);
  try { var ch = new BroadcastChannel('haa-view'); ch.onmessage = function(e){ render(e.data); }; } catch(e){}
  // BroadcastChannel が使えない環境のため、保存された状態も見る
  window.addEventListener('storage', function(e){ if (e.key === 'haa-view-state'){ try { render(JSON.parse(e.newValue)); } catch(_){} } });
})();
</script>
</body>
</html>
