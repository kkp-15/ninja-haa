<style>
/* OBS の「ウィンドウキャプチャ」向け。2026-10-22 枠・背景（クリーム／緑／透過）・待ち画面・クレジットは kit の k-view。
   16:9 の舞台（.k-view-stage）の中を cqh/cqw で組む（1920x1080 で前と同じ見た目）。
   字はどれも kit の --k-v-min（42px 以上＝どのウィンドウでも 1/3 に縮めて 14px 以上）を下回らない（縮める倍率 --f で割っておく）。
   操作ボタン・広告・計測は置かない。役（だれがどの気持ちか）は答えが出るまで届かない */
:root{--orange:#ff8a3d;--orange-d:#a8501a;--ink:#3b2c22;--muted:#6b5a48;--paper:#fffdf9;--line:#f0e2cc;--navy:#16213a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.k-view{color:var(--ink)}
.k-view-body{padding:0}
.wrap{position:absolute;inset:2.4cqh 3cqw 1cqh;display:flex;flex-direction:column;gap:1.6cqh}
.panel{background:var(--paper);border:.25cqh solid var(--line);border-radius:2cqh;padding:2.4cqh 2.6cqw;box-shadow:0 1cqh 3cqh rgba(22,33,58,.18)}
.stage{background:var(--navy) url('/kit/img/reveal-bg.webp') center/cover no-repeat;color:#fff;border-radius:2cqh;padding:3cqh 2cqw;text-align:center;box-shadow:0 1cqh 3cqh rgba(22,33,58,.25)}
.stage{position:relative;overflow:hidden}
.stage .pic{position:absolute;right:2cqw;bottom:0;height:100%;width:auto;pointer-events:none}
.who{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));opacity:.92}
.word{font-size:max(11cqh, calc(var(--k-v-min) / var(--f,1)));font-weight:900;line-height:1.2;letter-spacing:.02em}
.sub{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));opacity:.8}
.chat{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));color:#ffd8a8;margin-top:1cqh}
.cl{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:800;color:var(--muted);margin-bottom:1cqh}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqh 3cqw}
.cands div{font-size:calc(max(4.2cqh * var(--f,1), var(--k-v-min)) / var(--f,1));line-height:1.35;font-weight:700}
.no{display:inline-block;min-width:1.4em;color:var(--orange-d);font-weight:900}
.msg{text-align:center;font-size:calc(max(4.6cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:900}
.msg small{display:block;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:700;color:var(--muted);margin-top:.6cqh}
.cd{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cd span{font-size:max(40cqh, calc(var(--k-v-min) / var(--f,1)));font-weight:900;color:var(--orange);text-shadow:0 0 2cqh #fff,0 0 4cqh #fff;animation:pop .7s ease both}
/* カウントダウンは候補の番号（朱の ①②）と見分ける：墨の色・単位つき（2026-10-21） */
.cd span{display:inline-flex;align-items:baseline;color:var(--sumi);font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:max(30cqh, calc(var(--k-v-min) / var(--f,1)));line-height:1.05;padding:0 5cqh .5cqh;background:var(--kinari);border:.7cqh solid var(--sumi);border-radius:2cqh;box-shadow:1.2cqh 1.2cqh 0 var(--sumi);text-shadow:none}
.cd span small{font-family:"M PLUS Rounded 1c",sans-serif;font-size:max(.24em, var(--k-v-min));font-weight:800;margin-right:.15em}
.stage.last .word small{font-size:max(.35em, calc(var(--k-v-min) / var(--f,1)));margin:0 .1em}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.answers{display:grid;gap:1.6cqh}
.answers.many{grid-template-columns:1fr 1fr}
.ans{background:var(--navy) url('/kit/img/reveal-bg.webp') center/cover no-repeat;color:#fff;border-radius:2cqh;padding:1.8cqh 1.6cqw 2cqh;animation:pop .5s ease both}
.ans-top{display:flex;align-items:center;gap:.8cqw;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}
.dot{width:2.2cqh;height:2.2cqh;border-radius:50%;box-shadow:0 0 0 .3cqh rgba(255,255,255,.7)}
.ans-top .w{margin-left:auto;opacity:.8}
.ans-main{display:flex;align-items:center;justify-content:center;gap:1.2cqw;background:#fff;color:var(--ink);border:.6cqh solid var(--orange);border-radius:1.4cqh;padding:2cqh 1.4cqw;margin-top:1.2cqh}
.kick{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:900;color:#fff;background:var(--orange);border-radius:.8cqh;padding:.3cqh .8cqw}
.ans-main .n{font-size:max(9cqh, calc(var(--k-v-min) / var(--f,1)));font-weight:900;color:var(--orange-d);line-height:1}
.ans-main .a{font-size:max(7cqh, calc(var(--k-v-min) / var(--f,1)));font-weight:900;line-height:1.25}
.answers.many .ans-main .n{font-size:max(6cqh, calc(var(--k-v-min) / var(--f,1)))}.answers.many .ans-main .a{font-size:calc(max(4.4cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}
.chips{display:flex;flex-wrap:wrap;gap:.8cqh .6cqw;margin-top:1.2cqh}
.chip{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:800;border-radius:99cqh;padding:.4cqh 1cqw}
.chip.ok{background:#e6f4ea;color:#2f7a45}.chip.ng{background:rgba(255,255,255,.18);color:#fff}
.scores h3{margin:0 0 1cqh;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}
.scores h3 small{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));color:var(--muted);font-weight:400;margin-left:1cqw}
.sr{display:grid;grid-template-columns:7cqh minmax(14cqw,max-content) 1fr 10cqh;align-items:center;gap:1cqw;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));padding:.6cqh 0}
.rk{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:800;color:var(--muted);text-align:center}
.sr.top .rk{color:#fff;background:var(--orange);border-radius:99cqh;padding:.2cqh 0}
.nm{font-weight:800}
.bar{height:1.4cqh;background:#f3e8d6;border-radius:99cqh;overflow:hidden}.bar i{display:block;height:100%;border-radius:99cqh}
.pt{text-align:right;font-weight:900;color:var(--orange-d)}.pt small{display:block;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));color:var(--muted)}
.winpic{position:fixed;right:3cqw;bottom:5cqh;height:30cqh;width:auto;pointer-events:none;z-index:0;animation:pop .6s ease both}
.scores{position:relative;z-index:1}
/* 5人以上は得点を2列に（720pの画面の下にはみ出さないように） */
.scores.many{column-count:2;column-gap:3cqw}.scores.many h3{column-span:all}.scores.many .sr{break-inside:avoid;grid-template-columns:6cqh minmax(8cqw,max-content) 1fr 12cqh;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));padding:.3cqh 0}.scores.many .pt small{display:inline;margin-left:.4cqw}
body.vert .scores.many{column-count:1}body.vert .scores.mid .sr{grid-template-columns:12cqw 1fr 22cqw;font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)));padding:0;line-height:1.35}body.vert .scores.mid .rk{font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)))}body.vert .scores.mid h3{font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)))}
.stage{animation:pop .5s ease both}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-3cqh;width:1.2cqh;height:2cqh;border-radius:.3cqh;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110cqh) rotate(720deg)}}
.cta{color:var(--orange-d);font-size:calc(max(4cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}
.stage.last .word{font-size:max(16cqh, calc(var(--k-v-min) / var(--f,1)))}
/* 縦型配信（9:16）・縦の切り抜き用 ?layout=v（body.vert と 9:16 の箱は kit の KKit.view）。高さ基準(vh)の文字を幅基準(vw)に寄せる */
body.vert .wrap{inset:2.4cqh 4cqw 1cqh}
body.vert .word{font-size:max(15cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .who{font-size:max(4.6cqw, calc(var(--k-v-min) / var(--f,1)))}body.vert .sub{font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .chat{font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .cands{grid-template-columns:1fr}
body.vert .cands div{font-size:max(5.4cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .cl{font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .stage .pic{display:none}
body.vert .answers.many{grid-template-columns:1fr}
body.vert .ans-top{font-size:max(4cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .ans-main{flex-direction:column;gap:.5cqh}
body.vert .ans-main .n{font-size:max(16cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .ans-main .a{font-size:max(8cqw, calc(var(--k-v-min) / var(--f,1)));text-align:center}
body.vert .answers.many .ans-main .n{font-size:max(10cqw, calc(var(--k-v-min) / var(--f,1)))}body.vert .answers.many .ans-main .a{font-size:max(6cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .chip{font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .sr{grid-template-columns:12cqw 1fr 22cqw;font-size:max(4.6cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .sr .bar{display:none}
body.vert .rk{font-size:max(3.9cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .msg{font-size:max(5cqw, calc(var(--k-v-min) / var(--f,1)))}body.vert .cta{font-size:max(4.2cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .winpic{display:none}
body.vert .cd span{font-size:max(34cqw, calc(var(--k-v-min) / var(--f,1)))}
body.vert .stage.last .word{font-size:max(30cqw, calc(var(--k-v-min) / var(--f,1)))}
/* クレジットは細い舞台ではサイト名を外して1行に */
@container (max-width:1100px){ .k-view-credit .cn{display:none} .rcw .w{display:none} }

/* ===== 2026-10-20 大事な情報を大きく・太く（挿し絵は外す）。D4 の巻物・朱の札・判子で場面が一目で分かるように ===== */
:root{--sumi:#1f1a17;--shu:#c93b23;--kinari:#fbf3e4}
.stage .pic,.winpic{display:none!important}
.stage.scroll{background:none;color:var(--sumi);box-shadow:none;border-radius:0;border-style:solid;border-width:3.2cqh 7cqh;border-image:url(/kit/img/d3-scroll.webp) 56 84 fill / 3.2cqh 7cqh stretch;padding:1cqh 2cqw 1.6cqh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:3cqw;filter:drop-shadow(.6cqh .6cqh 0 rgba(31,26,23,.35))}
.stage.scroll .who{display:inline-block;padding:.4cqh 2cqw;background:var(--shu);color:#fff;border:.45cqh solid var(--sumi);border-radius:.6cqh;box-shadow:.7cqh .7cqh 0 var(--sumi);font-size:max(6cqh, calc(var(--k-v-min) / var(--f,1)));font-weight:900;opacity:1;transform:rotate(-2deg);animation:fudaIn .32s cubic-bezier(.2,.9,.3,1.4) both}
.stage.scroll .word{color:var(--sumi);font-family:"RocknRoll One","M PLUS Rounded 1c",sans-serif;font-weight:400;font-size:max(13cqh, calc(var(--k-v-min) / var(--f,1)));line-height:1.1}
.stage.scroll .chat{flex-basis:100%;color:var(--shu);font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:900;margin-top:.4cqh}
.stage.scroll .sub{flex-basis:100%;color:#4a3f37;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:800}
@keyframes fudaIn{0%{transform:rotate(-2deg) translateX(-40%);opacity:0}100%{transform:rotate(-2deg);opacity:1}}
.panel{background:var(--kinari);border:.4cqh solid var(--sumi);border-radius:1cqh;box-shadow:.7cqh .7cqh 0 var(--sumi)}
.cl{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1));color:#4a3f37}
.cands{gap:1cqh 3cqw}
.cands div{font-size:max(6.5cqh, calc(var(--k-v-min) / var(--f,1)));font-weight:900;line-height:1.2;color:var(--sumi)}
.no{color:var(--shu);font-size:1.15em;min-width:1.3em}
.msg{font-size:max(5.4cqh, calc(var(--k-v-min) / var(--f,1)));color:var(--sumi)}
.ans{background:var(--kinari);color:var(--sumi);border:.45cqh solid var(--sumi);border-radius:1cqh;box-shadow:.7cqh .7cqh 0 var(--sumi)}
.ans-top{font-size:calc(max(4cqh * var(--f,1), var(--k-v-min)) / var(--f,1));font-weight:900}
.ans-main{position:relative;border-color:var(--shu);border-width:.7cqh;justify-content:flex-start}
.ans-main .n{font-size:max(11cqh, calc(var(--k-v-min) / var(--f,1)));color:var(--shu)}
.ans-main .a{font-size:max(8.4cqh, calc(var(--k-v-min) / var(--f,1)));color:var(--sumi)}
.answers.many .ans-main .n{font-size:max(6cqh, calc(var(--k-v-min) / var(--f,1)))}.answers.many .ans-main .a{font-size:calc(max(4.4cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}.answers.many .ans-top{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}.answers.many .ans-main{padding:1.4cqh 9cqh 1.4cqh 1.4cqw}.answers.many .kick{width:8cqh;height:8cqh;margin-top:-4cqh;font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}.answers.many .chip{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}.answers.many .chip.ok{font-size:calc(max(3.9cqh * var(--f,1), var(--k-v-min)) / var(--f,1))}
.ans-main{padding-right:15cqh}

  function dealStage(st){
    var p = st.dealPpl, cur = null, done = 0, all = true;
    p.forEach(function(x){ if (x.s === 1) cur = x; if (x.s === 2) done++; else all = false; });
    var fuda = all ? (p.length > 1 ? '全員の確認が済みました' : '確認が済みました') : cur ? 'いま '+cur.n+' さんが確認中' : '気持ちの確認';
    var sub = all ? 'まもなく始まります' : (cur ? '' : '演じる人が自分の気持ちを、こっそり見ます。') + (p.length > 1 ? '全員の' : '') + '確認が済んだら始まります（'+done+' / '+p.length+'）';
    var key0 = (st.word||'') + '|';
    return '<div class="stage scroll deal"><div class="who">'+esc(fuda)+'</div><div class="word">「'+esc(st.word)+'」</div><div class="sub">'+esc(sub)+'</div><div class="ppl">'
      + p.map(function(x, i){
        var k = key0 + i, fresh = x.s === 2 && !stamped[k]; if (x.s === 2) stamped[k] = 1;
        return '<span class="pp s'+esc(x.s)+(fresh?' fresh':'')+'"><span class="pn">'+esc(x.n)+'</span><span class="mk">'+(x.s === 2 ? '済' : x.s === 1 ? '確認中' : 'まだ')+'</span></span>';
      }).join('') + '</div></div>';
  }
  // 回答コードで届いた人（名前と受付の印だけ）
  // 手元で入れた予想（配信する・2人以上の流れ）も同じ形。rcAll があるときは、まだでも帯を出す
  function rcw(st){
    var L = st.rc || []; if (!L.length && !st.rcAll) return '';
    var n = st.rcN != null ? st.rcN : L.length;
    return '<div class="panel rcw"><span class="h">'+(st.rcAll ? '予想' : '回答コード')+'</span>' + (L.length ? L.map(function(x){ return '<span class="p"><span class="hk">済</span>'+esc(x.n)+(x.mk ? '<small>'+esc(x.mk)+'</small>' : '')+'</span>'; }).join('') : '<span class="w">まだだれも回答していません</span>')
      + '<span class="n">'+esc(n)+'人回答済み'+(st.rcAll ? '<small>（全'+esc(st.rcAll)+'人）</small>' : '')+'</span></div>';
  }
  // 投票結果（2026-10-21）：だれが何番を選んだか・同じ番号はまとめる。答えはまだ届かない
  var lastVo = '';
  function voBoard(st){
    var d = st.vopen, flip = d.id !== lastVo, k = 0; lastVo = d.id;
    var chip = function(x){ return '<span class="vp'+(x.l?' lis':'')+'" style="--d:'+((k++)*0.06).toFixed(2)+'s"><i style="background:'+esc(x.c)+'"></i>'+esc(x.n)+'</span>'; };
    var many = d.rows.length >= 5;
    return '<div class="stage scroll vo"><div class="who">投票結果</div><div class="word">「'+esc(d.word)+'」</div><div class="sub">'+esc(d.who)+'さんの演技、みんなの予想は…（答えはこのあと）</div></div>'
      + '<div class="panel vob'+(many?' many':'')+(flip?' flip':'')+'">'
      + d.rows.map(function(r){ return '<div class="vr'+(r.ppl.length?' has':'')+(r.ppl.length>=2?' same':'')+'"><span class="vc"><b>'+esc(r.no)+'</b>'+q(r.text)+'</span><span class="vps">'+(r.ppl.length>=2?'<span class="vk">'+r.ppl.length+'人</span>':'')+r.ppl.map(chip).join('')+'</span></div>'; }).join('')
      + ((d.none||[]).length || d.lisNone ? '<div class="vr miss"><span class="vc">未回答</span><span class="vps">'+d.none.map(chip).join('')+(d.lisNone?'<span class="vp lis"><i style="background:#8a7f74"></i>リスナー</span>':'')+'</span></div>' : '')
      + '</div>';
  }
  // 受け取った瞬間のハンコ（操作ページで貼ったとき・届いてから4秒以内だけ。読み直しで出し直さない）
  var stampEl = document.getElementById('stamp'), lastStamp = '', stampT = null;
  function showStamp(st){
    var x = st.stamp; if (!x || x.id === lastStamp) return; lastStamp = x.id;
    if (st.step !== 'deal' && st.step !== 'perform' && st.step !== 'vote') return;
    if (Date.now() - (st.t||0) > 4000) return;
    stampEl.innerHTML = '<span class="hk">済</span><span class="t"><b>'+esc(x.n)+(x.l ? '' : 'さん')+'</b><small>受け取りました</small></span>'+(x.mk ? '<span class="no">受付 '+esc(x.mk)+'</span>' : '');
    stampEl.hidden = false; stampEl.classList.remove('go'); void stampEl.offsetWidth; stampEl.classList.add('go');
    clearTimeout(stampT); stampT = setTimeout(function(){ stampEl.hidden = true; stampEl.classList.remove('go'); }, 1000);
  }
  function render(st, force){
    if (st) showStamp(st);
    lastSt = st;
    // 2026-10-21 待ち画面は題字と「まもなく始まります」だけ（配信者向けの説明は操作画面に）。kit の k-view-idle
    if (!st || st.step === 'setup') { lastSig = ''; cd._h = ''; wrap.innerHTML = ''; recentEl.innerHTML = ''; cd.innerHTML = ''; V.idle(true, '声と表情で当てるゲーム'); return; }
    V.idle(false);
    var one = st.actors && st.actors.length === 1 ? st.actors[0] + ' さんの番' : (st.actors ? st.actors.length + '人が順番に演じます' : '');
    var h = '';
    if (st.step === 'deal' && st.dealPpl && st.dealPpl.length){
      h = dealStage(st) + cands(st) + rcw(st);
    } else if (st.step === 'deal'){
      h = '<div class="stage scroll"><div class="who">'+esc(one)+'</div><div class="word">「'+esc(st.word)+'」</div><div class="sub">演じる人が、自分の気持ちを確認しています</div></div>' + cands(st);
    } else if (st.step === 'perform'){
      h = stage(st, one) + cands(st, '気持ちの候補（この中のどれかを演じます）') + rcw(st);
    } else if (st.step === 'vote'){
      h = stage(st, one) + cands(st) + rcw(st) + '<div class="panel msg">投票中 '+esc(st.voteDone)+' / '+esc(st.voteTotal)+'<small>一緒に遊ぶ人が答えを選んでいます</small></div>';
    } else if (st.step === 'result' && st.vopen){
      h = voBoard(st);
    } else if (st.step === 'result' && st.veiling){
      h = '<div class="stage scroll"><div class="who">'+esc(one)+'</div><div class="word">「'+esc(st.word)+'」</div><div class="sub">まもなく答え合わせ</div></div>' + cands(st, '気持ちの候補');
    } else if (st.step === 'result'){
      var a = st.answers || [];
      h = '<div class="answers'+(a.length>1?' many':'')+'">' + a.map(function(x){
        var chips = (x.chips||[]).map(function(c){ return '<span class="chip '+(c.ok?'ok':'ng')+'">'+(c.ok?'○ ':'× ')+esc(c.name)+(c.mk?'<small class="mk">'+esc(c.mk)+'</small>':'')+(c.ok?'':' '+esc(c.no))+'</span>'; }).join('');
        return '<div class="ans"><div class="ans-top"><span class="dot" style="background:'+esc(x.color)+'"></span><b>'+esc(x.name)+'</b><span class="w">「'+esc(st.word)+'」</span></div>'
          + '<div class="ans-main"><span class="kick">正解</span><span class="n">'+esc(x.no)+'</span><span class="a">'+esc(x.act)+'</span></div>'
          + (chips ? '<div class="chips">'+chips+'</div>' : '') + '</div>';
      }).join('') + '</div>';
      if (st.ask) h += '<div class="panel msg cta">'+esc(st.ask)+'</div>';
      var s = st.scores;
      if (s && s.rows && s.rows.length){
        var max = Math.max.apply(null, s.rows.map(function(r){return r.total;})) || 0, rank = 0, prev = null;
        h += '<div class="panel scores'+(s.rows.length>=5?' mid many':s.rows.length>=4?' mid':'')+'"><h3>'+(s.rounds>1?'合計得点<small>'+esc(s.rounds)+'回目まで</small>':'得点')+'</h3>' + s.rows.map(function(r,i){
          if (r.total !== prev){ rank = i+1; prev = r.total; }
          return '<div class="sr'+(rank===1&&max>0?' top':'')+'"><span class="rk">'+rank+'位</span><span class="nm"><span class="n">'+esc(r.name)+'</span>'+(r.pt?'<small class="hitx">'+esc(r.pt)+'</small>':(r.tries!=null?'<small class="hitx">当てた '+esc(r.hit)+'/'+esc(r.tries)+'・伝わった '+esc(r.got)+'回</small>':''))+'</span>'
            + '<span class="bar"><i style="width:'+(max>0?Math.round(r.total/max*100):0)+'%;background:'+esc(r.color)+'"></i></span><span class="pt">'+esc(r.total)+'点'+(s.rounds>1?'<small>+'+esc(r.add)+'</small>':'')+'</span></div>';
        }).join('') + (s.titles ? '<div class="ttls">'+s.titles.map(function(x){ return '<span><b>'+esc(x.t)+'</b>'+esc(x.names)+'<small>'+esc(x.why)+'</small></span>'; }).join('')+'</div>' : '') + '</div>';
      }
    }
    if (st.summary){
      var sm = st.summary;
      h = '<div class="panel sum"><h2>今日のまとめ</h2>' + (sm.titles ? '<div class="ttls">'+sm.titles.map(function(x){ return '<span><b>'+esc(x.t)+'</b>'+esc(x.names)+'<small>'+esc(x.why)+'</small></span>'; }).join('')+'</div>' : '')
        + '<table><thead><tr><th>名前</th><th>当てた</th><th>伝わった</th><th>点</th></tr></thead><tbody>'
        + (sm.people||[]).map(function(p){ return '<tr><th>'+esc(p.name)+'</th><td>'+esc(p.hit)+'<small>/'+esc(p.tries)+'</small></td><td>'+esc(p.got)+'<small>回</small></td><td class="p">'+esc(p.pts)+'</td></tr>'; }).join('') + '</tbody></table>'
        + ((sm.all||[]).length || (sm.none||[]).length ? '<div class="marks">' + (sm.all||[]).map(function(x){ return '<div class="m-all"><em>伝わった！</em>'+esc(x.no)+'回目「'+esc(x.word)+'」'+esc(x.who)+'</div>'; }).join('') + (sm.none||[]).map(function(x){ return '<div class="m-none"><em>まさかの！</em>'+esc(x.no)+'回目「'+esc(x.word)+'」'+esc(x.who)+'</div>'; }).join('') + '</div>' : '')
        + '</div>';
    }
    var rc = st.recent || [];
    var rkey = rc.length ? rc[rc.length-1].no + '|' + rc.length : '';
    // 2026-10-22 中身が変わったときだけ描き直す（V.fit は測るたびに動きを頭から出し直すため。窓の大きさ・背景・字が変わったときは refit から force）
    var cdH = (st.step === 'result' && st.cd) ? '<span><small>答えまで あと</small>'+esc(st.cd)+'</span>' : '';
    if (st.step === 'result' && st.veiling && st.last) h = '<div class="stage scroll last"><div class="who">最終予想タイム！</div><div class="word"><small>あと</small><span class="sec">#</span><small>秒</small></div><div class="chat">コメントで番号を（例：③）</div></div>' + cands(st, '気持ちの候補「'+(st.word||'')+'」');
    // 3・2・1 と最終予想タイムの秒は、その字だけを書きかえる（毎秒 描き直すと、出てくる動きが毎秒やり直しになる）
    if (cd._h !== cdH){ cd.innerHTML = cdH; cd._h = cdH; }
    var sig = h + '§' + JSON.stringify(rc);
    if (!force && sig === lastSig){ var sec = wrap.querySelector('.stage.last .sec'); if (sec) sec.textContent = st.last; return; }
    lastSig = sig;
    recentEl.innerHTML = rc.length ? rc.map(function(x, i){
      var g = (x.g||[]).length ? x.g.map(function(y){ return '<i class="'+(y.ok?'o':'x')+'">'+(y.ok?'○':'×')+'</i>'; }).join('') : '<i class="x">口で</i>';
      return '<span class="rs'+(x.mark?' m-'+x.mark:'')+(i===rc.length-1 && rkey!==lastRecent?' new':'')+'"><b>'+esc(x.no)+'</b>「'+esc(x.word)+'」'+esc(x.ans)+g+(x.mark==='all'?'<em>伝わった！</em>':x.mark==='none'?'<em>まさかの！</em>':'')+'</span>';
    }).join('') : '';
    lastRecent = rkey;
    // 2026-10-22 直近の回は1行に入る分だけ（古い方から外す）。中身は直近の回の上までに置く
    while (recentEl.children.length > 1 && recentEl.scrollWidth > recentEl.clientWidth + 1) recentEl.removeChild(recentEl.firstChild);
    wrap.style.bottom = recentEl.children.length && !document.body.classList.contains('vert') ? Math.ceil(recentEl.offsetHeight + vstage.clientHeight * 0.02) + 'px' : '';
    var key = st.step + '|' + (st.veiling?1:0) + '|' + (st.word||'');
    if (st.step === 'result' && !st.veiling && lastKey !== key && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) burst();
    lastKey = key;
    wrap.innerHTML = h;
    var sec0 = wrap.querySelector('.stage.last .sec'); if (sec0) sec0.textContent = st.last;
    squeeze();
  }
  // 縮めて1画面に（kit の KKit.view.fit。測る間は動きを止める）。縮めきっても入らないとき（8人・細い窓など。字は42pxより小さくしない）は、なくても困らない行を順に外して入れ直す
  function squeeze(){
    V.fit(wrap, { drop: ['.panel.msg.cta', '.stage .chat', '.stage .sub', '.ttls', '.cl', '.panel.msg small', '.hitx',
      // 答えの札（12字の名前×7人で3〜4段になる）：外れた人は「× ほか◯人」に、まだ入らなければ当てた人も「○ ◯人」に
      function(){ return chipFold('ng', '× ほか'); }, function(){ return chipFold('ok', '○ '); },
      // 未回答の名前は人数だけに
      function(){ var mv = wrap.querySelector('.vr.miss .vps'); if (mv && mv.children.length > 1){ mv.innerHTML = '<span class="vp">' + mv.children.length + '人</span>'; return true; } },
      function(){ if (recentEl.children.length){ recentEl.innerHTML = ''; wrap.style.bottom = ''; return true; } },
      // 候補の中の「ふーん」（上に大きく出ている言葉と同じ）を外して1行に
      '.cands .q', '.vc .q',
      // 回答の帯は「◯人回答済み」だけに（縦型・細い窓）
      '.rcw .w', '.rcw .h', '.rcw .n small', '.rcw .p',
      '.panel.msg',
      // 2026-10-22 小さい窓・8人：答えの判子（42pxの字が判子からはみ出す）と「得点」の見出し（順位があれば分かる）
      '.ans .kick', '.scores h3'] });
  }
  function chipFold(c, label){
    var hit = false;
    [].forEach.call(wrap.querySelectorAll('.chips'), function(box){
      var L = box.querySelectorAll('.chip.'+c+':not(.sum)'); if (L.length < (c === 'ng' ? 2 : 1)) return;
      var n = L.length; [].forEach.call(L, function(x){ x.remove(); });
      var e = document.createElement('span'); e.className = 'chip '+c+' sum'; e.textContent = label + n + '人'; box.appendChild(e); hit = true;
    });
    return hit;
  }
  var lastKey = '', lastRecent = '', lastSt = null, lastSig = '';
  function burst(){
    var box = document.createElement('div'); box.className = 'confetti';
    var cols = ['#ff8a3d','#ffd43b','#ff6b9d','#51cf66','#4c6ef5','#fff3e2'];
    for (var i=0;i<110;i++){ var p = document.createElement('i'); p.style.left = (Math.random()*100)+'vw'; p.style.background = cols[i%cols.length];
      p.style.animationDuration = (1.6+Math.random()*1.4)+'s'; p.style.animationDelay = (Math.random()*0.5)+'s'; box.appendChild(p); }
    document.body.appendChild(box); setTimeout(function(){ box.remove(); }, 3800);
  }
  // 操作ページ（同じブラウザ）から kit の KKit.live で受け取る。s が null＝まだ何もない（待ち画面）
  KKit.live({ ch: 'haa-view', role: 'view', onState: function(s){ render(s); } }).start();
  // 字のデータ（日本語は字ごとに分かれている）が後から届いた・窓の大きさが変わったときは測り直す（kit の KKit.view.refit）
  KKit.view.refit(function(){ if (lastSt) render(lastSt, true); });
})();
</script>
</body>
</html>
